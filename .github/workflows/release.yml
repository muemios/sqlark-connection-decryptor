name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # 手动触发：只构建产物，不创建 Release

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64-gui
            os: windows-2025
            variant: gui
          - target: windows-x64-cli
            os: windows-2025
            variant: cli
          - target: linux-x64-cli
            os: ubuntu-22.04
            variant: cli
          - target: linux-arm64-cli
            os: ubuntu-22.04-arm
            variant: cli
          - target: macos-arm64-cli
            os: macos-15
            variant: cli
          - target: macos-x64-cli
            os: macos-15-intel
            variant: cli
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build ${{ matrix.variant }} binary
        run: python scripts/build_binary.py --variant ${{ matrix.variant }}

      - name: Smoke test CLI binary
        if: matrix.variant == 'cli'
        shell: bash
        run: |
          set -euo pipefail
          name=$(python scripts/build_binary.py --variant cli --print-name)
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          "./dist/${name}${ext}" decrypt tests/fixtures/demo-connections.xml --quiet

      - name: Verify GUI artifact exists
        if: matrix.variant == 'gui'
        shell: bash
        run: |
          set -euo pipefail
          name=$(python scripts/build_binary.py --variant gui --print-name)
          test -f "dist/${name}.exe"

      - name: Package (Linux/macOS, keeps executable bit)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do tar -czf "${f}.tar.gz" "$f"; rm "$f"; done

      - name: Generate checksums for this platform
        run: python scripts/checksums.py dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: python scripts/checksums.py artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
